<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BIGWorks — Studio de desarrollo de juegos en Roblox">
  <meta name="robots" content="index, follow">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>BIGWorks — Roblox Development Studio</title>
  <style>
    :root {
      --bg: #000000;
      --fg: #f5f5f7;
      --muted: #86868b;
      --border: #1d1d1f;
      --card: #0a0a0a;
      --hover: #1a1a1a;
      --radius: 18px;
      --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.theme-light {
      --bg: #ffffff;
      --fg: #1d1d1f;
      --muted: #6e6e73;
      --border: #d2d2d7;
      --card: #f5f5f7;
      --hover: #e8e8ed;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.47059;
      letter-spacing: -0.022em;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background 0.4s var(--ease), color 0.4s var(--ease);
    }

    .container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 0 22px;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
      transition: background 0.4s var(--ease), border-color 0.4s var(--ease);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
    }

    .logo {
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      color: var(--fg);
      transition: opacity 0.3s var(--ease);
    }

    .logo:hover { opacity: 0.7; }

    .nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav a {
      font-size: 14px;
      font-weight: 400;
      color: var(--fg);
      text-decoration: none;
      opacity: 0.8;
      transition: opacity 0.3s var(--ease);
    }

    .nav a:hover { opacity: 1; }

    .theme-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: var(--card);
      color: var(--fg);
      font-size: 15px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.3s var(--ease), transform 0.3s var(--ease);
    }

    .theme-btn:hover {
      background: var(--hover);
      transform: scale(1.08);
    }

    .theme-btn:active { transform: scale(0.95); }

    /* Hero */
    .hero {
      padding: 120px 0 100px;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(48px, 8vw, 80px);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.05;
      margin-bottom: 12px;
    }

    .hero-sub {
      font-size: 21px;
      font-weight: 400;
      color: var(--muted);
    }

    /* Sections */
    .section-title {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 40px;
      text-align: center;
    }

    /* Projects */
    .projects { padding: 40px 0 100px; }

    .project-card {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      max-width: 680px;
      margin: 0 auto;
      transition: transform 0.5s var(--ease-out), box-shadow 0.5s var(--ease-out), border-color 0.4s var(--ease);
    }

    .project-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      border-color: var(--fg);
    }

    body.theme-light .project-card:hover {
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
    }

    .project-banner {
      background: #000000 !important;
      height: 280px;
      display: grid;
      place-items: center;
    }

    .coming-soon {
      font-size: 64px;
      font-weight: 200;
      letter-spacing: 0.35em;
      color: #ffffff;
      user-select: none;
      animation: pulse 3s var(--ease) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .project-info {
      padding: 28px 32px 32px;
      text-align: center;
    }

    .project-info h3 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.015em;
      margin-bottom: 6px;
    }

    .status {
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* Contact */
    .contact {
      padding: 80px 0 120px;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    .contact-text {
      font-size: 19px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .contact-link {
      display: inline-block;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 500;
      color: var(--fg);
      text-decoration: none;
      border: 1px solid var(--fg);
      border-radius: 980px;
      transition: background 0.35s var(--ease), color 0.35s var(--ease), transform 0.3s var(--ease);
    }

    .contact-link:hover {
      background: var(--fg);
      color: var(--bg);
      transform: scale(1.03);
    }

    .contact-link:active { transform: scale(0.98); }

    /* Footer */
    .footer {
      padding: 32px 0 48px;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    .footer p {
      font-size: 12px;
      color: var(--muted);
    }

    /* Entrance */
    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s var(--ease-out) forwards;
    }

    .delay-1 { animation-delay: 0.12s; }
    .delay-2 { animation-delay: 0.24s; }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 734px) {
      .hero { padding: 90px 0 70px; }
      .hero h1 { font-size: 40px; }
      .hero-sub { font-size: 17px; }
      .section-title { font-size: 28px; }
      .project-banner { height: 200px; }
      .coming-soon { font-size: 42px; letter-spacing: 0.25em; }
      .nav { gap: 18px; }
    }
  </style>
</head>
<body class="theme-dark">
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">BIGWorks</a>
      <nav class="nav" aria-label="Navegación principal">
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
        <button id="theme-toggle" class="theme-btn" aria-label="Cambiar tema">◐</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1 class="fade-in">BIGWorks</h1>
        <p class="hero-sub fade-in delay-1">Roblox Development Studio</p>
      </div>
    </section>

    <section id="projects" class="projects">
      <div class="container">
        <h2 class="section-title fade-in">Projects</h2>
        <article class="project-card fade-in delay-2">
          <div class="project-banner">
            <span class="coming-soon">???</span>
          </div>
          <div class="project-info">
            <h3>My Hybrid Sanctuary</h3>
            <p class="status">Coming Soon</p>
          </div>
        </article>
      </div>
    </section>

    <section id="contact" class="contact">
      <div class="container">
        <h2 class="section-title fade-in">Contact</h2>
        <p class="contact-text fade-in delay-1">Para consultas profesionales</p>
        <a href="#" id="contact-link" class="contact-link fade-in delay-2" rel="noopener noreferrer">
          [ENLACE DE CONTACTO — PENDIENTE]
        </a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> BIGWorks. All rights reserved.</p>
    </div>
  </footer>

  <script>
    (function () {
      "use strict";
      const body = document.body;
      const toggle = document.getElementById("theme-toggle");
      const yearEl = document.getElementById("year");

      if (yearEl) yearEl.textContent = new Date().getFullYear();

      const saved = localStorage.getItem("bigworks-theme");
      if (saved === "light") {
        body.classList.replace("theme-dark", "theme-light");
      }

      if (toggle) {
        toggle.addEventListener("click", () => {
          const isDark = body.classList.contains("theme-dark");
          body.classList.toggle("theme-dark", !isDark);
          body.classList.toggle("theme-light", isDark);
          localStorage.setItem("bigworks-theme", isDark ? "light" : "dark");
        });
      }

      document.addEventListener("contextmenu", e => e.preventDefault());
      document.addEventListener("dragstart", e => {
        if (e.target.tagName === "IMG") e.preventDefault();
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BIGWorks — Studio de desarrollo de juegos en Roblox">
  <meta name="robots" content="index, follow">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>BIGWorks — Roblox Development Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-dark">
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">BIGWorks</a>
      <nav class="nav" aria-label="Navegación principal">
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
        <button id="theme-toggle" class="theme-btn" aria-label="Cambiar tema">
          <span class="theme-icon">◐</span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>BIGWorks</h1>
        <p class="hero-sub">Roblox Development Studio</p>
      </div>
    </section>

    <section id="projects" class="projects">
      <div class="container">
        <h2>Projects</h2>
        <div class="project-card">
          <div class="project-banner">
            <span class="coming-soon">???</span>
          </div>
          <div class="project-info">
            <h3>My Hybrid Sanctuary</h3>
            <p class="status">Coming Soon</p>
          </div>
        </div>
      </div>
    </section>

    <section id="contact" class="contact">
      <div class="container">
        <h2>Contact</h2>
        <p>Para consultas profesionales:</p>
        <a href="#" id="contact-link" class="contact-link" rel="noopener noreferrer">
          [ENLACE DE CONTACTO — PENDIENTE]
        </a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> BIGWorks. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
